    <script>
        window.addEventListener('load', function () {
            const preloader = document.getElementById('preloader');
            preloader.style.opacity = '0';
            setTimeout(() => { preloader.style.display = 'none'; }, 100);
        });

        // Initialize Comparison Sliders
        function initComparisons() {
            const compares = document.querySelectorAll(".compare");

            compares.forEach(compare => {
                const input = compare.querySelector(".compare__input");
                const imageOne = compare.querySelector(".compare__image-one");
                const imageTwo = compare.querySelector(".compare__image-two");

                // Set initial state
                compare.style.setProperty("--mask-width", `${input.value}%`);

                input.addEventListener("input", () => {
                    compare.style.setProperty("--mask-width", `${input.value}%`);
                });

                // Match image-two width to image-one's rendered width
                function syncImageWidth() {
                    if (imageOne && imageTwo) {
                        imageTwo.style.width = imageOne.offsetWidth + 'px';
                    }
                }

                // Sync on image load and window resize
                if (imageOne) {
                    if (imageOne.complete) {
                        syncImageWidth();
                    } else {
                        imageOne.addEventListener('load', syncImageWidth);
                    }
                }
                window.addEventListener('resize', syncImageWidth);
            });
        }

        // Call on DOM ready
        document.addEventListener('DOMContentLoaded', initComparisons);
    </script>
