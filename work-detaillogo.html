<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO Meta Tags -->
  <title>Logo Design | HEIF Artist</title>
  <meta name="description"
    content="Browse HEIF's logo design portfolio featuring creative brand identities and logo concepts.">
  <meta name="author" content="Jayesh Mepani">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#000000">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Logo Design | HEIF Artist">
  <meta property="og:description" content="Creative logo designs and brand identities by HEIF Artist.">
  <meta property="og:image" content="assets/img/thumbnail/logo.jpg">
  <meta property="og:site_name" content="HEIF Artist">

  <!-- Preconnect for Performance (Google Fonts) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="assets/img/logow.png">

  <link rel="stylesheet" href="assets/css/css.css">
  <link rel="stylesheet" href="assets/css/masonry.css">
  <link rel="stylesheet" href="assets/css/cursor.css">
  <script src="assets/vendor/three.min.js" defer></script>
  <script src="assets/vendor/gsap.min.js" defer></script>
  <script src="assets/vendor/ScrollTrigger.min.js" defer></script>
  <script src="assets/vendor/lenis.min.js" defer></script>
  <script src="assets/js/script.js" defer></script>

  <script src="assets/js/scroll-animations.js" defer></script>
  <script src="assets/js/particles-effect.js" defer></script>
</head>

<body>
  <!-- Skip Link for Accessibility -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Preloader -->
  <div id="preloader" aria-hidden="true">
    <div class="loader"></div>
  </div>

  <canvas id="webgl-canvas"></canvas>

  <div class="stars-layer">
    <div class="stars-extra"></div>
  </div>
  <!-- Header -->
  <header role="banner">
    <div class="header__logo">
      <a href="index.html" aria-label="HEIF Artist Home">
        <img src="assets/img/logo.png" alt="HEIF Artist Logo" width="122" height="auto">
      </a>
    </div>
    <nav aria-label="Main navigation">
      <ul role="list">
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="work.html">Portfolio</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="linktree.html">Linktree</a></li>
      </ul>
      <a href="#" class="nav-toggle hover-link" aria-label="Toggle navigation menu" aria-expanded="false">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" />
        </svg>
      </a>
    </nav>
  </header>

  <!-- Main Content -->
  <main id="main-content">
    <div class="wil-content">
      <section class="awe-section" aria-labelledby="page-title">
        <div class="container">
          <div class="page-title pb-40">
            <h1 id="page-title" class="page-title__title">Logo Design</h1>
            <div class="page-title__divider"></div>
          </div>
        </div>
      </section>
      <section class="image-showcase" aria-label="Logo design gallery">
        <div class="flex-container">
          <div class="image-item"><img src="assets/img/works/01.jpg" alt="Logo design 1" loading="lazy"
              decoding="async"></div>
          <div class="image-item"><img src="assets/img/works/02.jpg" alt="Logo design 2" loading="lazy"
              decoding="async"></div>
        </div>
      </section>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer" role="contentinfo">
    <div class="footer-container">
      <div class="footer-logo-container">
        <a href="index.html" aria-label="HEIF Artist Home">
          <img src="assets/img/logo.png" alt="HEIF Artist Logo" class="footer-logo" loading="lazy" decoding="async">
        </a>
      </div>
      <div class="footer-home">
        <a class="footer-btn home-btn" href="index.html">Home</a>
      </div>
      <div class="footer-social-media">
        <a href="linktree.html" target="_blank" rel="noopener noreferrer">LINKTREE</a>
      </div>
    </div>
    <div class="footer-rights">
      <p>&copy; 2024 HEIF Artist. All rights reserved.</p>
      <p class="developer-credit">Enhanced & Optimized by <a href="https://jayeshmepani.github.io/Portfolio/"
          target="_blank" rel="noopener noreferrer">Jayesh Mepani</a></p>
    </div>
  </footer>

  <link rel="stylesheet" href="assets/vendor/justifiedGallery.min.css" />
  <script src="assets/vendor/jquery.min.js"></script>
  <script src="assets/vendor/jquery.justifiedGallery.min.js"></script>
  <script>
    window.addEventListener('load', function () {
      const preloader = document.getElementById('preloader');
      preloader.style.opacity = '0';
      setTimeout(() => { preloader.style.display = 'none'; }, 500);
    });

    $(document).ready(function () {
      $(".flex-container").addClass("masonry-container").removeClass("flex-container");
      $(".masonry-container").justifiedGallery({
        rowHeight: 350,
        maxRowHeight: 800,
        justifyThreshold: 0.1,
        margins: 15,
        border: 0,
        lastRow: "center",
        captions: false,
      });
    });
  </script>
</body>

</html>
